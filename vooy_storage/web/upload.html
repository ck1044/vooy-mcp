<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>자료 업로드</title><style>body{font:16px system-ui;max-width:40rem;margin:3rem auto;padding:0 1rem;color:#182230}main{padding:1.5rem;border:1px solid #d6dbe5;border-radius:14px}button{background:#344bde;color:white;border:0;border-radius:8px;padding:.8rem 1.2rem;cursor:pointer}button:disabled{opacity:.5}input,progress{width:100%;margin:1rem 0}#status{white-space:pre-wrap;line-height:1.6}</style></head><body><main><h1>자료 업로드</h1><p>이미지, 영상 또는 텍스트 파일을 선택해 주세요. 연결이 끊기면 같은 파일을 다시 선택해 이어 올릴 수 있습니다.</p><label for="file">파일 선택</label><input id="file" type="file"><button id="upload" disabled>업로드 시작</button><button id="pause" disabled>일시 중단</button><progress id="progress" max="100" value="0"></progress><p id="status" role="status">연결 중입니다.</p></main><script src="/upload-static/upload.js" defer></script></body></html>
